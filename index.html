<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1">
<title>사장으로 살아남기</title>
</head>
<body>
<!-- 화면은 시뮬레이션 검증 후에 얹는다. 지금은 로직만. -->
</body>

<script>
/* ==========================================================================
   사장으로 살아남기 — 게임 로직
   기획: 기획.md  /  이벤트 규칙: 이벤트_작성규칙.md
   ※ 이 <script> 가 유일한 로직 원본이다. sim.js 가 이 파일을 그대로 구동한다.
      절대 로직을 다른 곳에 복제하지 말 것 (앞 게임에서 두 번 어긋났음)
   ========================================================================== */

const CFG = {
  /* ---- 시작 상태 ---- */
  시작돈: 3000, 시작평판: 5, 시작분위기: 80, 시작실력: 30, 시작직원: 1,

  /* ---- 돈 ---- */
  기본매출: 1000,          // 직원 1명 / 1분기
  인건비: 600,             // 1명 / 1분기 (대표 제외)
  인건비연상승: 0.05,

  /* ---- 양극단 페널티 : 지표 → 계수 ---- */
  계수구간: [
    { max: 20,  v: 0.5 },   // 위험
    { max: 40,  v: 0.8 },   // 아쉬움
    { max: 75,  v: 1.0 },   // 안전
    { max: 90,  v: 0.9 },   // 슬슬 과열
    { max: 999, v: 0.7 },   // 과열
  ],

  /* ---- 업무 4개 : E/I × S/N 직교 ---- */
  업무: {
    영업:   { ei:'E', sn:'S', 배수:0.2, 평판:+8 },
    마케팅: { ei:'E', sn:'N', 배수:0.5, 평판:+5, 분위기:+2 },
    개발:   { ei:'I', sn:'N', 배수:1.0, 평판:+3, 실력:+3, 분위기:-3 },
    외주:   { ei:'I', sn:'S', 배수:1.3, 평판:-2, 실력:-2 },
  },

  /* ---- 인력 4개 : T/F · J/P 전담 ---- */
  인력배수: 0.7,
  인력: ['채용','해고','교육','휴가'],
  채용비율: 0.25, 채용최소: 2, 채용단가: 300,
  해고비율: 0.10, 해고최소: 1,
  교육비: 500, 휴가비: 300,

  /* ---- 회사 단계 ---- */
  단계: [
    { 이름:'스타트업', 최대직원:10,   사무실:150 },
    { 이름:'중소기업', 최대직원:100,  사무실:180 },
    { 이름:'중견기업', 최대직원:500,  사무실:220 },
    { 이름:'대기업',   최대직원:1e9,  사무실:260 },
  ],

  /* ---- 이벤트 ---- */
  트리거확률: 0.25,        // 인력관리 실행 시 (첫 해고·첫 채용은 100%)
  사건확률: 0.25,          // 분기당. 발생하면 계획 수정 기회 → J/P

  /* ---- 측정 가중치 ---- */
  가중_트리거: 1.0,
  가중_배치판채용: 0.3,    // 수치로 고르게 되므로 약하게
  판정최소표본: 3,
};

/* --------------------------------------------------------------------------
   트리거 이벤트 — 인력관리 버튼을 누르면 발동
   돈은 전부 + (버튼 눌러서 뜬 거라 손해보면 억울하다)
   돈 크기는 직원수 비례 → 규모가 커져도 스케일이 맞는다
   -------------------------------------------------------------------------- */
const 트리거 = {
  채용: [
    { 글:'경력을 뽑는다', 축:'T', 돈인당:100, 실력:+3 },
    { 글:'신입을 뽑는다', 축:'F', 돈인당:100, 분위기:+3, 다음실력:+3 },
  ],
  해고: [
    { 글:'지금 말해주는 게 낫다',   축:'T', 강도:2, 돈인당:200 },
    { 글:'퇴직금을 두둑히 챙겨준다', 축:'T', 강도:1, 돈인당:100, 실력:+3 },
    { 글:'아는 회사에 자리를 알아봐준다', 축:'F', 강도:1, 돈인당:100, 평판:+3 },
    { 글:'일단 안고 간다',          축:'F', 강도:2, 돈인당:100, 분위기:+6, 해고취소:true },
  ],
  교육: [
    { 글:'제일 잘하는 사람을 보낸다',   축:'T', 실력:+6 },
    { 글:'제일 못 따라오는 사람을 보낸다', 축:'F', 분위기:+6, 다음실력:+3 },
  ],
  휴가: [
    { 글:'날짜를 정해서 다 같이 쉰다', 축:'J', 분위기:+6 },
    { 글:'각자 알아서 쓰게 한다',      축:'P', 분위기:+3, 평판:+3 },
  ],
};

/* ========================= 순수 계산 ========================= */

const clamp = (v, lo, hi) => Math.max(lo, Math.min(hi, v));

// 지표(0~100) → 계수. 양극단 페널티
function 계수(v) {
  for (const g of CFG.계수구간) if (v < g.max) return g.v;
  return CFG.계수구간[CFG.계수구간.length - 1].v;
}

function 단계(S) {
  for (const st of CFG.단계) if (S.직원 <= st.최대직원) return st;
  return CFG.단계[CFG.단계.length - 1];
}
function 단계인덱스(S) {
  for (let i = 0; i < CFG.단계.length; i++) if (S.직원 <= CFG.단계[i].최대직원) return i;
  return CFG.단계.length - 1;
}

function 매출(S, slot) {
  const w = CFG.업무[slot];
  const 배수 = w ? w.배수 : CFG.인력배수;
  return Math.round(
    S.직원 * CFG.기본매출 *
    계수(S.실력) * 계수(S.평판) * 계수(S.분위기) * 배수
  );
}

function 지출(S) {
  const st = 단계(S);
  const 연차 = Math.floor(S.분기 / 4);
  const 인건 = Math.max(0, S.직원 - 1) * CFG.인건비 * Math.pow(1 + CFG.인건비연상승, 연차);
  const 사무실 = S.직원 * st.사무실;
  return Math.round(인건 + 사무실);
}

function 채용인원(S) { return Math.max(CFG.채용최소, Math.round(S.직원 * CFG.채용비율)); }
function 해고인원(S) { return Math.max(CFG.해고최소, Math.round(S.직원 * CFG.해고비율)); }

/* ========================= 상태 ========================= */

function newGame() {
  return {
    분기: 0,
    돈: CFG.시작돈,
    평판: CFG.시작평판,
    분위기: CFG.시작분위기,
    실력: CFG.시작실력,
    직원: CFG.시작직원,

    축: { E:0, I:0, S:0, N:0, T:0, F:0, J:0, P:0 },
    다음실력: 0,            // 다음 분기에 반영될 실력 보너스
    첫채용함: false, 첫해고함: false,
    승급이력: [],           // { 분기, 단계, 진단 }
    로그: [],
    최저돈: CFG.시작돈,
    과열분기: 0,            // 어떤 지표든 90 이상이었던 분기 수
    위험분기: 0,            // 어떤 지표든 20 미만이었던 분기 수
    계획수정: 0, 계획유지: 0,
  };
}

function 축가산(S, k, w) { if (k && S.축[k] !== undefined) S.축[k] += w; }

function 지표적용(S, e) {
  if (e.평판)   S.평판   = clamp(S.평판   + e.평판,   0, 100);
  if (e.분위기) S.분위기 = clamp(S.분위기 + e.분위기, 0, 100);
  if (e.실력)   S.실력   = clamp(S.실력   + e.실력,   0, 100);
  if (e.다음실력) S.다음실력 += e.다음실력;
}

/* ========================= 한 분기 진행 =========================
   slot   : '영업'|'마케팅'|'개발'|'외주'|'채용'|'해고'|'교육'|'휴가'
   choose : (슬롯, 선택지배열) => 인덱스   — 트리거 이벤트 응답자
   ============================================================== */
function runQuarter(S, slot, choose, rnd) {
  rnd = rnd || Math.random;
  S.분기++;

  // 1) 지난 분기에 예약된 실력 보너스
  if (S.다음실력) { S.실력 = clamp(S.실력 + S.다음실력, 0, 100); S.다음실력 = 0; }

  // 2) 매출 · 지출
  const rev = 매출(S, slot);
  const cost = 지출(S);
  S.돈 += rev - cost;

  // 3) 슬롯 효과
  const w = CFG.업무[slot];
  if (w) {
    지표적용(S, w);
    축가산(S, w.ei, 1);
    축가산(S, w.sn, 1);
  } else {
    인력처리(S, slot, choose, rnd);
  }

  // 4) 관측
  if (S.돈 < S.최저돈) S.최저돈 = S.돈;
  const mx = Math.max(S.평판, S.분위기, S.실력);
  const mn = Math.min(S.평판, S.분위기, S.실력);
  if (mx >= 90) S.과열분기++;
  if (mn < 20)  S.위험분기++;

  return { 매출: rev, 지출: cost };
}

function 인력처리(S, slot, choose, rnd) {
  // 트리거 이벤트 발동 여부
  let 발동 = rnd() < CFG.트리거확률;
  if (slot === '채용' && !S.첫채용함) { 발동 = true; S.첫채용함 = true; }
  if (slot === '해고' && !S.첫해고함) { 발동 = true; S.첫해고함 = true; }

  let 해고취소 = false;

  if (발동) {
    const opts = 트리거[slot];
    const i = clamp(choose(slot, opts), 0, opts.length - 1);
    const o = opts[i];
    축가산(S, o.축, CFG.가중_트리거 * (o.강도 || 1));
    지표적용(S, o);
    if (o.돈인당) S.돈 += o.돈인당 * S.직원;
    if (o.해고취소) 해고취소 = true;
  }

  if (slot === '채용') {
    const n = 채용인원(S);
    S.돈 -= n * CFG.채용단가;
    S.직원 += n;
    // 배치판 자체의 실력/인성 선택 — 가중치 낮음
    const 실력위주 = choose('채용방침', [{축:'T'},{축:'F'}]) === 0;
    축가산(S, 실력위주 ? 'T' : 'F', CFG.가중_배치판채용);
    지표적용(S, 실력위주 ? { 실력:+5 } : { 분위기:+5 });
  } else if (slot === '해고') {
    if (!해고취소) {
      const n = Math.min(해고인원(S), Math.max(0, S.직원 - 1));
      S.직원 -= n;
      S.돈 += 400;
      지표적용(S, { 분위기:-5 });
    }
  } else if (slot === '교육') {
    S.돈 -= CFG.교육비;
    지표적용(S, { 실력:+6 });
  } else if (slot === '휴가') {
    S.돈 -= CFG.휴가비;
    지표적용(S, { 분위기:+8 });
  }
}

/* ========================= 계획 수정 (J/P) ========================= */
// 사건이 터졌을 때 남은 분기 계획을 바꾸는가
function 사건발생(rnd) { return (rnd || Math.random)() < CFG.사건확률; }
function 계획수정기록(S, 수정함) {
  if (수정함) { 축가산(S, 'P', 1); S.계획수정++; }
  else        { 축가산(S, 'J', 1); S.계획유지++; }
}

/* ========================= 승급 ========================= */
function 승급확인(S, prevIdx) {
  const now = 단계인덱스(S);
  if (now > prevIdx) {
    const d = diagnose(S);
    S.승급이력.push({ 분기: S.분기, 단계: CFG.단계[now].이름, 진단: d.유형, 상세: d });
    return CFG.단계[now];
  }
  return null;
}

/* ========================= MBTI 판정 ========================= */
function diagnose(S) {
  const ax = S.축;
  const one = (a, b) => {
    const t = ax[a] + ax[b];
    if (t < CFG.판정최소표본) return { 글자: '?', 비율: 0.5, 표본: t, 확신: 0 };
    const r = ax[a] / t;
    return {
      글자: r === 0.5 ? (a) : (r > 0.5 ? a : b),
      비율: r,
      표본: t,
      확신: Math.abs(r - 0.5) * 2,
    };
  };
  const ei = one('E','I'), sn = one('S','N'), tf = one('T','F'), jp = one('J','P');
  return {
    유형: ei.글자 + sn.글자 + tf.글자 + jp.글자,
    ei, sn, tf, jp,
    최소표본: Math.min(ei.표본, sn.표본, tf.표본, jp.표본),
    평균확신: (ei.확신 + sn.확신 + tf.확신 + jp.확신) / 4,
  };
}

/* ========================= 노출 =========================
   vm 컨텍스트에서 const 는 ctx 속성이 되지 않는다.
   반드시 window 에 담아서 꺼낼 수 있게 한다. (앞 게임에서 밟은 함정)
   ======================================================= */
window.__game = {
  CFG, 트리거,
  newGame, runQuarter, diagnose,
  계수, 단계, 단계인덱스, 매출, 지출,
  채용인원, 해고인원,
  사건발생, 계획수정기록, 승급확인,
};
</script>
</html>
